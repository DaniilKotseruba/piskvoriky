<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="script.js" defer></script>
</head>
<style>
    body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f4f4f4;
    }

    #turn {
        font-size: 20px;
        margin-bottom: 12px;
        font-weight: bold;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        grid-template-rows: repeat(10, 40px);
        gap: 2px;
        background: #888;
        border: 2px solid #888;
    }

    .cell {
        width: 40px;
        height: 40px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
    }

    .cell:hover {
        background: #eee;
    }

    #reset {
        margin-top: 16px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
    }
</style>
<body>

<div id="turn">Turn: X</div>
<div id="board"></div>
<button id="reset">Reset</button>

</body>
</html>
